name: Bug report
description: Report a reproducible problem using fictional data.
body:
  - type: markdown
    attributes:
      value: Do not include private calendar links, personal events, notes, credentials or backup files. Use a clean demo profile for screenshots.
  - type: input
    id: version
    attributes:
      label: Extension and browser versions
      placeholder: No 1.2.2, Firefox 140 or Chrome version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Window size, operating system and screenshots with fictional data only.
